name: Keep Render Awake

on:
  schedule:
    # Every 10 minutes — before Render's ~15 min free-tier idle spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ secrets.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://wanderlust-mini-airbnb.onrender.com/health"
          fi
          echo "Pinging $URL"
          curl -fsS --max-time 30 "$URL"
          echo
          echo "Keep-alive ping OK"
